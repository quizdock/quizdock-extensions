# Publishes the quizzes and themes of this repository for the QuizDock community store.
# Nothing to change here: upload unzipped exports into quizzes/ or themes/, this does the rest.
name: Publish

on:
  push:
    branches: [main]
    paths: ['quizzes/**', 'themes/**', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quizdock/quizdock-store/publish-action@main
